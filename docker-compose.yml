version: "3.8"

services:
  music-cover-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-cover-studio:latest
    container_name: music-cover-studio
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_NAME=0.0.0.0
      - PORT=7860
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./outputs:/app/outputs
      - ./temp/cache_stems:/app/temp/cache_stems
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
